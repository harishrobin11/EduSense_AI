version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edusense_backend
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=EduSense AI
      - APP_ENV=production
      - DATABASE_URL=sqlite:////app/edusense.db
      - SECRET_KEY=edusense-ai-super-secret-production-jwt-key-2026
      - LOG_LEVEL=INFO
    volumes:
      - edusense_data:/app/data_volume
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: edusense_frontend
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  edusense_data:
    driver: local
